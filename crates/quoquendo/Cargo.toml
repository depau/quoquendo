[package]
name = "quoquendo"
version = "0.1.0"
edition = "2021"
description = "Loquendo 7 (LTTS7) text-to-speech for its original voice files, without the original engine"

[dependencies]
lzma-rs = { version = "0.3", features = ["stream"] }
miniz_oxide = "0.8"
# pure-Rust MPEG-1 Layer III encoder, for saving speech as MP3
audio2mp3-core = "0.2"
# pure-Rust FLAC encoder (no threads: it runs in browsers too)
flacenc = { version = "0.5", default-features = false }
# pure-Rust Opus encoder with Ogg encapsulation
opus-pure = "0.2"
regex = "1.13.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
