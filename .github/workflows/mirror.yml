name: mirror

# The voices: every installer of the pack unpacked into the LTTS7 tree and
# uploaded to R2 under v1/, with v1/catalog.json. Run by hand.

on:
  workflow_dispatch:

concurrency:
  group: cloudflare-mirror
  cancel-in-progress: false

jobs:
  mirror:
    runs-on: ubuntu-latest
    # the file table it commits (mirror/FILES.md)
    permissions:
      contents: write
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      BUCKET: quoquendo
      MIRROR: ${{ vars.QQ_MIRROR_URL }}
    steps:
      - uses: actions/checkout@v4
      # the CLI is the desktop app's binary: rodio links ALSA
      - name: System libraries
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libasound2-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - name: Build
        run: cargo build --release --bin quoquendo
      # the pack's installers never change: keep them between runs instead of
      # fetching 2.5 GB from archive.org each time
      - name: Installers cache
        uses: actions/cache@v4
        with:
          path: installers
          key: installers-${{ hashFiles('crates/quoquendo/src/catalog.rs') }}
          restore-keys: installers-
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install wrangler
        run: npm install -g wrangler@4
      - name: Download and unpack every installer
        run: |
          set -euo pipefail
          mkdir -p installers out/LTTS7
          ./target/release/quoquendo --list-installers > installers.txt
          while IFS= read -r f; do
            [ -n "$f" ] || continue
            if [ ! -s "installers/$f" ]; then
              enc=$(jq -rn --arg s "$f" '$s|@uri')
              curl -fL --retry 5 --retry-all-errors -o "installers/$f" \
                "https://archive.org/download/text-to-speech-oddcast-voices-pack-2024/Loquendo%207/$enc"
            fi
            ./target/release/quoquendo --unpack "installers/$f" out/LTTS7
          done < installers.txt
      # Catalan, Valencian and Galician come in no voice installer: their
      # language distributions, on no public site, were put once under the
      # bucket's distributions/ (which the Worker doesn't serve)
      - name: Language distributions
        run: |
          set -euo pipefail
          for f in "Catalan & Valencian Distribution.exe" "Galician Distribution.exe"; do
            if [ ! -s "installers/$f" ]; then
              wrangler r2 object get "$BUCKET/distributions/$f" --file "installers/$f" --remote
            fi
            ./target/release/quoquendo --unpack "installers/$f" out/LTTS7
          done
      - name: Catalog
        run: ./target/release/quoquendo --mirror-catalog out/LTTS7 out/catalog.json
      # only the files whose checksum differs from the catalog already on the
      # mirror (every one, the first time); the catalog last, so the mirror
      # never lists a file it doesn't hold yet
      - name: Upload to R2
        run: |
          set -euo pipefail
          files='[.voices[].files[], (.languages[]?.files[])] | unique_by(.path) | .[] | "\(.path)\t\(.sha256)"'
          jq -r "$files" out/catalog.json | sort > new.tsv
          { curl -fsS "${MIRROR%/}/v1/catalog.json" | jq -r "$files" || true; } | sort > old.tsv
          comm -23 new.tsv old.tsv | cut -f1 > upload.txt
          echo "$(wc -l < upload.txt) of $(wc -l < new.tsv) files to upload"
          cd out/LTTS7
          xargs -a ../../upload.txt -P 8 -I{} wrangler r2 object put "$BUCKET/v1/{}" --file "{}" --remote
          wrangler r2 object put "$BUCKET/v1/catalog.json" --file ../catalog.json --content-type application/json --remote
      # the same files as a page on GitHub, for downloads outside the app
      - name: File table
        run: |
          set -euo pipefail
          ./target/release/quoquendo --mirror-table out/catalog.json "$MIRROR" mirror/FILES.md
          git add mirror/FILES.md
          if ! git diff --cached --quiet; then
            git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -m "Mirror: file table"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - name: Deploy the Worker
        working-directory: mirror/worker
        run: wrangler deploy
