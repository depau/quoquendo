name: android

# A nightly of every push to main: the `nightly` GitHub release, replaced each
# time, holding quoquendo-nightly-<date>-<sha>.apk (eu.depau.quoquendo.nightly).
# Without the signing secrets it only builds a debug APK as an artifact.

on:
  push:
    branches: [main]
    paths:
      - android/**
      - crates/**
      - Cargo.toml
      - Cargo.lock
      - .github/workflows/android.yml
  workflow_dispatch:

concurrency:
  # the release is deleted and re-created: never cut a publish in half
  group: android-nightly
  cancel-in-progress: false

jobs:
  nightly:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      SIGNING_KEY_ALIAS: ${{ secrets.KEY_ALIAS || vars.KEY_ALIAS }}
      SIGNING_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      SIGNING_STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      QQ_MIRROR_URL: ${{ vars.QQ_MIRROR_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      # built once, then restored from the cache
      - uses: taiki-e/cache-cargo-install-action@v2
        with:
          tool: cargo-ndk
      - name: Build
        id: build
        env:
          KEYSTORE: ${{ secrets.KEYSTORE }}
        run: |
          set -euo pipefail
          export ANDROID_NDK_HOME="$ANDROID_NDK_LATEST_HOME"
          mkdir -p nightly
          if [ -z "$KEYSTORE" ] || [ -z "$SIGNING_KEY_ALIAS" ]; then
            # the same key every time, or installed nightlies can't update
            echo "::warning::no signing key (secrets KEYSTORE, KEYSTORE_PASSWORD, KEY_PASSWORD, KEY_ALIAS): debug build only, nothing published"
            (cd android && ./gradlew assembleDebug --stacktrace)
            mv android/app/build/outputs/apk/debug/app-debug.apk nightly/quoquendo-debug.apk
            echo "signed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/release.keystore"
          export SIGNING_STORE_FILE="$RUNNER_TEMP/release.keystore"
          version_code=$(( $(git show -s --format=%ct HEAD) / 60 ))
          version_name="0.1.0-nightly.${GITHUB_SHA::7}"
          (cd android && ./gradlew assembleRelease -Pnightly=true -PversionCode="$version_code" -PversionName="$version_name" --stacktrace)
          rm "$SIGNING_STORE_FILE"
          mv android/app/build/outputs/apk/release/app-release.apk "nightly/quoquendo-nightly-$(date -u +%Y%m%d)-${GITHUB_SHA::7}.apk"
          echo "signed=true" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: quoquendo-android
          path: nightly/*.apk
          compression-level: 0
      - name: Publish the nightly release
        if: steps.build.outputs.signed == 'true' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release delete nightly --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag 2>/dev/null || true
          gh release create nightly nightly/*.apk \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Nightly" \
            --notes "Nightly build of \`main\` (${GITHUB_SHA::7}). Android app \`eu.depau.quoquendo.nightly\`." \
            --prerelease
