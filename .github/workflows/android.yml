name: android

# A nightly of every push to main: the `nightly` GitHub release, replaced each
# time, holding quoquendo-nightly-<date>-<sha>.apk (eu.depau.quoquendo.nightly).

on:
  push:
    branches: [main]
    paths:
      - android/**
      - crates/**
      - Cargo.toml
      - Cargo.lock
      - .github/workflows/android.yml
  workflow_dispatch:

concurrency:
  # the release is deleted and re-created: never cut a publish in half
  group: android-nightly
  cancel-in-progress: false

jobs:
  nightly:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-ndk
        run: cargo install --locked cargo-ndk
      - name: Build
        env:
          SIGNING_KEY_ALIAS: ${{ vars.KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          SIGNING_STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          SIGNING_STORE_FILE: ${{ github.workspace }}/release.keystore
          QQ_MIRROR_URL: ${{ vars.QQ_MIRROR_URL }}
        run: |
          set -euo pipefail
          # the same key every time, or installed nightlies can't update
          [ -n "$SIGNING_KEY_ALIAS" ] || { echo "::error::set the KEYSTORE, KEYSTORE_PASSWORD, KEY_PASSWORD secrets and the KEY_ALIAS variable"; exit 1; }
          echo "${{ secrets.KEYSTORE }}" | base64 -d > release.keystore
          export ANDROID_NDK_HOME="$ANDROID_NDK_LATEST_HOME"
          version_code=$(( $(git show -s --format=%ct HEAD) / 60 ))
          version_name="0.1.0-nightly.${GITHUB_SHA::7}"
          cd android
          ./gradlew assembleRelease -Pnightly=true -PversionCode="$version_code" -PversionName="$version_name" --stacktrace
          cd ..
          rm release.keystore
          mkdir -p nightly
          mv android/app/build/outputs/apk/release/app-release.apk "nightly/quoquendo-nightly-$(date -u +%Y%m%d)-${GITHUB_SHA::7}.apk"
      - name: Publish the nightly release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release delete nightly --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag 2>/dev/null || true
          gh release create nightly nightly/*.apk \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Nightly" \
            --notes "Nightly build of \`main\` (${GITHUB_SHA::7}). Android app \`eu.depau.quoquendo.nightly\`." \
            --prerelease
