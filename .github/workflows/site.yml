name: site

# The web app, served by the same Worker and R2 bucket as the voices
# (mirror/worker): built with trunk, uploaded under site/.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: cloudflare-site
  cancel-in-progress: true

jobs:
  site:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      BUCKET: quoquendo
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      # a prebuilt trunk instead of `cargo install` (7 minutes)
      - uses: taiki-e/install-action@v2
        with:
          tool: trunk
      # the wasm-bindgen and wasm-opt trunk downloads
      - uses: actions/cache@v4
        with:
          path: ~/.cache/trunk
          key: trunk-tools-${{ hashFiles('Cargo.lock') }}
          restore-keys: trunk-tools-
      # std's clock panics in browsers and freezes the app (clippy.toml)
      - name: Lint the browser build
        run: cargo clippy --release --target wasm32-unknown-unknown --bin quoquendo --bin qq_unpack_worker -- -A clippy::all -D clippy::disallowed_methods
      # the app fetches voices from the site it is served from
      - name: Build
        run: trunk build --release --public-url /
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install wrangler
        run: npm install -g wrangler@4
      # hashed files first, index.html last: a visitor never gets an
      # index.html whose files aren't there yet
      - name: Upload to R2
        run: |
          set -euo pipefail
          cd dist
          find . -type f ! -name index.html ! -name '.*' -printf '%P\n' | sort | while IFS= read -r p; do
            wrangler r2 object put "$BUCKET/site/$p" --file "$p" --remote
          done
          wrangler r2 object put "$BUCKET/site/index.html" --file index.html --content-type 'text/html; charset=utf-8' --remote
      - name: Deploy the Worker
        working-directory: mirror/worker
        run: wrangler deploy
